services:
  mysql:
    image: mysql:8.0
    container_name: taroti_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: taroti_root_2026
      MYSQL_DATABASE: taroti_dev
      MYSQL_USER: taroti_user
      MYSQL_PASSWORD: taroti_pass_2026
    ports:
      - "3306:3306"
    volumes:
      - taroti_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  taroti_mysql_data:
